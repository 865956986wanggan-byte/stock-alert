name: 盘中推送（A股均线粘合）

on:
  schedule:
    # 北京时间（UTC+8）：09:45 10:15 10:45 11:15 / 13:15 13:45 14:15 14:45 15:05，周一~五
    - cron: '45 1 * * 1-5'
    - cron: '15 2 * * 1-5'
    - cron: '45 2 * * 1-5'
    - cron: '15 3 * * 1-5'
    - cron: '15 5 * * 1-5'
    - cron: '45 5 * * 1-5'
    - cron: '15 6 * * 1-5'
    - cron: '45 6 * * 1-5'
    - cron: '5 7 * * 1-5'
  workflow_dispatch: {}

# 允许保活步骤把运行记录推回仓库（避免 60 天无活动自动暂停定时任务）
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install pandas numpy

      - name: 盘中扫描并推送新信号
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python ma_alert/main.py scan

      - name: 保活并记录去重状态（避免60天无活动自动暂停）
        run: |
          echo "$(date -u +'%Y-%m-%d %H:%M:%S UTC')" > last_run.txt
          git config user.name "stock-alert-bot"
          git config user.email "stock-alert-bot@users.noreply.github.com"
          git add last_run.txt
          git add -f outputs/seen.json outputs/spot_cache.json 2>/dev/null || true
          git commit -m "daily keep-alive $(date -u +%Y%m%d%H%M%S)" || echo "无文件变化，跳过提交"
          git push
