name: 盘中推送（A股均线粘合）

on:
  schedule:
    # 北京时间（UTC+8）：09:45 10:15 10:45 11:15 / 13:15 13:45 14:15 14:45 15:05，周一~五
    - cron: '55 1 * * 1-5'   # 09:55 早盘批量
    - cron: '0 3 * * 1-5'    # 11:00 上午批量
    - cron: '35 5 * * 1-5'   # 13:35 午后批量
    - cron: '45 6 * * 1-5'   # 14:45 尾盘批量
    - cron: '5 7 * * 1-5'    # 15:05 收盘总结
  workflow_dispatch: {}

# 允许保活步骤把运行记录推回仓库（避免 60 天无活动自动暂停定时任务）
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install pandas numpy

      - name: 盘中扫描并推送新信号（失败自动微信告警）
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python ma_alert/main.py scan > /tmp/scan.log 2>&1 \
            || python ma_alert/main.py alertfail "$(tail -c 600 /tmp/scan.log)"

      - name: 保活并记录去重状态（避免60天无活动自动暂停）
        run: |
          echo "$(date -u +'%Y-%m-%d %H:%M:%S UTC')" > last_run.txt
          git config user.name "stock-alert-bot"
          git config user.email "stock-alert-bot@users.noreply.github.com"
          git add last_run.txt
          git add -f outputs/seen.json outputs/spot_cache.json outputs/scan_stats.json 2>/dev/null || true
          git commit -m "daily keep-alive $(date -u +%Y%m%d%H%M%S)" || echo "无文件变化，跳过提交"
          git push
